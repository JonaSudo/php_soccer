# LUPUS hardware data: single source for robots/lupus/build_urdf.py.
#
# The CAD export (source/robot_model.urdf) carries placeholder limits
# (effort 1000, velocity 10, mostly +-pi), no armature, no neck and several
# parts without mass. Everything here overrides that export. Values marked
# `status: estimate` or `status: placeholder` still need confirmation on the
# real robot; see README.md for the open questions.

supply_voltage: 24.0   # V; datasheet speeds below are at 24 V

# MyActuator X-series V4 product manual (2025-02-11), 24 V.
# armature = rotor_inertia * gear_ratio^2 (reflected rotor inertia at the output).
motors:
  RMD-X4-36:
    gear_ratio: 36.0
    peak_torque: 34.0        # N*m
    rated_torque: 11.5       # N*m
    no_load_speed_rpm: 111   # output side
    rated_speed_rpm: 83
    rotor_inertia: 0.30e-4   # kg*m^2 (0.30 kg*cm^2, motor side)
    mass: 0.36               # kg
  RMD-X2-7:
    gear_ratio: 28.17
    peak_torque: 7.0
    rated_torque: 2.5
    no_load_speed_rpm: 178
    rated_speed_rpm: 142
    rotor_inertia: 0.17e-4
    mass: 0.25

# Which motor drives which joint. Derived from where the motor meshes sit in
# the CAD tree (stator on the parent link, output flange on the child link).
# Limits are in the URDF joint frame of the export (all axes +z of the joint
# frame); signs were checked with forward kinematics in the zero pose:
#   hip/shoulder pitch: negative = leg/arm swings forward
#   knee: positive = flexion;  elbow: negative = flexion (forearm forward)
#   left hip/shoulder roll: positive = outward; right side mirrored
#   ankle pitch: positive = toes down
#
# status: cad          from the CAD export
#         k1_reference Booster K1 (booster_assets K1_22dof.urdf), used until
#                      LUPUS is built and its stops are measured
#         estimate     own guess, no source
# To change a limit, edit lower/upper here and rerun build_urdf.py.
joints:
  # --- legs -----------------------------------------------------------------
  left_hip_pitch:      {motor: RMD-X4-36, lower: -2.958, upper: 2.226, status: k1_reference}
  right_hip_pitch:     {motor: RMD-X4-36, lower: -2.958, upper: 2.226, status: k1_reference}
  left_hip_roll:       {motor: RMD-X4-36, lower: -0.3665, upper: 1.5708, status: cad}
  right_hip_roll:      {motor: RMD-X4-36, lower: -1.5708, upper: 0.3665, status: cad}
  left_hip_yaw:        {motor: RMD-X4-36, lower: -1.012, upper: 1.012, status: k1_reference}
  right_hip_yaw:       {motor: RMD-X4-36, lower: -1.012, upper: 1.012, status: k1_reference}
  left_knee:           {motor: RMD-X4-36, lower: 0.0,    upper: 2.321, status: k1_reference}
  right_knee:          {motor: RMD-X4-36, lower: 0.0,    upper: 2.321, status: k1_reference}
  # Ankle pitch/roll are driven by two RMD-X2-7 through a parallel linkage
  # (see `ankle_linkage`); torque, speed and armature are derived there.
  left_ankle_pitch:    {motor: ankle_linkage, axis: pitch, lower: -0.7330, upper: 1.0996, status: cad}
  right_ankle_pitch:   {motor: ankle_linkage, axis: pitch, lower: -0.7330, upper: 1.0996, status: cad}
  left_ankle_roll:     {motor: ankle_linkage, axis: roll,  lower: -0.6109, upper: 0.6109, status: cad}
  right_ankle_roll:    {motor: ankle_linkage, axis: roll,  lower: -0.6109, upper: 0.6109, status: cad}
  # --- arms -----------------------------------------------------------------
  left_shoulder_pitch:  {motor: RMD-X4-36, lower: -2.932, upper: 1.196, status: k1_reference}
  right_shoulder_pitch: {motor: RMD-X4-36, lower: -2.932, upper: 1.196, status: k1_reference}
  # K1 zero pose has the arms raised (default roll -+1.3 lowers them); its
  # range [-1.642, 1.629] is shifted by 1.3 rad into LUPUS's arms-down zero.
  left_shoulder_roll:   {motor: RMD-X2-7,  lower: -0.342, upper: 2.929, status: k1_reference}
  right_shoulder_roll:  {motor: RMD-X2-7,  lower: -2.929, upper: 0.342, status: k1_reference}
  # K1 has no shoulder yaw (its 4th arm joint is a forearm yaw).
  left_shoulder_yaw:    {motor: RMD-X2-7,  lower: -1.57, upper: 1.57, status: estimate}
  right_shoulder_yaw:   {motor: RMD-X2-7,  lower: -1.57, upper: 1.57, status: estimate}
  # K1 elbow pitch +-1.885; only the flexing side, no hyperextension.
  left_elbow:           {motor: RMD-X2-7,  lower: -1.885, upper: 0.0, status: k1_reference}
  right_elbow:          {motor: RMD-X2-7,  lower: -1.885, upper: 0.0, status: k1_reference}

# Parallel ankle: two RMD-X2-7 on the shin (joints *_ankle_motor_1/2 in the
# export) drive the foot via cranks ("hebel") and rods. A closed loop is not
# representable in URDF, so the policy and the simulation act on the serial
# equivalent ankle_pitch/ankle_roll; the robot converts to motor angles.
# The motor joints become fixed (their rotor and crank masses stay on the shin).
#   pitch: both motors same direction, rod lever d   -> ratio d/r
#   roll:  motors opposite, lateral rod offset w     -> ratio w/r
#   tau_joint = 2*tau_motor*ratio, omega_joint = omega_motor/ratio,
#   armature_joint = 2*armature_motor*ratio^2
ankle_linkage:
  motor: RMD-X2-7
  motor_joints: [left_ankle_motor_1, left_ankle_motor_2, right_ankle_motor_1, right_ankle_motor_2]
  crank_radius_r: 0.040     # m, status: estimate from "hebel" mesh (~45 mm long)
  pitch_lever_d: 0.040      # m, status: estimate (rod attachment to pitch axis)
  roll_lever_w: 0.027       # m, from CAD: motors sit +-27 mm beside the ankle

# Neck: missing in the CAD export. Joint offsets, limits, motor and masses
# follow the Booster K1 head (aahead_yaw/pitch, HT4438 servo) until LUPUS's
# neck exists. Not part of the policy action space.
neck:
  status: k1_reference
  parent_link: Torso
  yaw_origin_base: [0.0, 0.0, 0.96]   # m in base frame, top of torso shell (LUPUS CAD)
  pitch_offset: [0.0, 0.0, 0.033]     # m from yaw joint (K1)
  head_yaw:   {lower: -1.012, upper: 1.012, effort: 6.0, velocity: 7.85, armature: 0.002}
  head_pitch: {lower: -0.314, upper: 0.794, effort: 6.0, velocity: 7.85, armature: 0.002}
  neck_link: {mass: 0.30, size: [0.05, 0.05, 0.033], com: [0.0, 0.0, 0.032]}
  head_link: {mass: 0.70, size: [0.12, 0.14, 0.13],  com: [0.011, 0.0, 0.081]}

# Parts the export left at 1e-6 kg (no material in CAD) or with wrong mass.
# `density` in g/cm^3 is applied to the mesh volume; `mass` sets it directly;
# `scale` multiplies the exported mass. Matched on the mesh file name.
mass_fixes:
  - {mesh: RMD-X4-36_1__Volumenk_rper1.stl,     mass: 0.30995, note: "housing; datasheet 0.36 kg minus 0.05 kg flange part"}
  - {mesh: RMD-X4-36_MIR1_1__Volumenk_rper1.stl, mass: 0.30995, note: "housing; datasheet 0.36 kg minus 0.05 kg flange part"}
  - {mesh: RMD-X2-7_,          scale: 0.8335, note: "export sums to 0.30 kg, datasheet 0.25 kg"}
  - {mesh: foot_1__Volumenk_rper1.stl, density: 2.70, note: "mirror part foot_MIR is aluminium"}
  - {mesh: hebel_,             density: 2.70, note: "assumed aluminium"}
  - {mesh: upup_,              density: 2.70, note: "assumed aluminium"}
  - {mesh: kiub_,              density: 2.70, note: "assumed aluminium"}
  - {mesh: lower-leg-versteifung_, density: 2.70, note: "assumed aluminium like Schienbein"}
  - {mesh: upper_arm_1__Volumenk_rper1.stl, density: 0.48, note: "assumed print like Stumpf2/footlow"}
  - {mesh: H_fteeinzelteol_,   density: 0.48, note: "assumed print"}
  - {mesh: DIN_981_KM_,        density: 7.85, note: "steel lock nut"}

# Total mass the model is brought to after the fixes above. Until LUPUS is
# weighed this is the Booster K1 (datasheet ~19.5 kg); replace `total` with
# the scale reading, or set it to null to keep the pure CAD mass.
#   method: scale -> all link masses and inertias scaled by the same factor
#   method: lump  -> the gap as one box on `link` at `position_base`
#                    (needs size: [x, y, z] and position_base: [x, y, z])
mass_target:
  total: 19.5
  method: scale
  source: Booster K1 reference, not weighed
